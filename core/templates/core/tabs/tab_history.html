<!-- TAB 5: HISTORY & AUDIT LOGS -->
<div class="tab-pane" id="pane-history">
    <div class="history-pane-container">
        <!-- Toolbar Card -->
        <div class="history-toolbar-card">
            <div class="history-toolbar-left">
                <span style="font-size:0.85rem; font-weight:800; color:#fff;" class="history-title">📜 <span class="hide-mobile">Historical Verification </span>Events</span>
                <span style="font-size:0.72rem; color:var(--ug-text-dim);" class="hide-mobile">(Click any event row to inspect full audit details)</span>
                <!-- Filter Chips (TUI Cycle Filter) -->
                <div class="history-filter-chips">
                    <button class="history-chip active" data-hfilter="ALL" onclick="setHistoryFilter('ALL')">All</button>
                    <button class="history-chip" data-hfilter="SUBMITTED" onclick="setHistoryFilter('SUBMITTED')">Submitted</button>
                    <button class="history-chip" data-hfilter="FAILED" onclick="setHistoryFilter('FAILED')">Failed</button>
                    <button class="history-chip" data-hfilter="ISSUES" onclick="setHistoryFilter('ISSUES')">Issues / Conflicts</button>
                </div>
            </div>

            <div class="history-toolbar-right">
                <!-- Date Scope Filter & Actions -->
                <div class="scope-pills-group" style="margin-left:0; display: flex; flex-wrap: wrap; gap: 4px;">
                    <span style="font-size:0.68rem; color:var(--ug-text-dim); padding-left:4px; font-weight:700; align-self: center;" class="hide-mobile">DATE:</span>
                    <button class="scope-pill-btn active" id="btn-hscope-today" onclick="setHistoryDateScope('TODAY')" title="Show audit logs from today's shift (Hotkey: D)">
                        🔥 Today<span class="hide-mobile">'s Shift</span>
                    </button>
                    <button class="scope-pill-btn" id="btn-hscope-all" onclick="setHistoryDateScope('ALL')" title="Show all audit logs across entire history">
                        🌐 All<span class="hide-mobile"> Time</span>
                    </button>
                    <button class="scope-pill-btn" onclick="fetchHistoryEvents()" title="Refresh" style="color: var(--ug-cyan);">
                        🔄 Refresh
                    </button>
                    <a href="/api/export/report/" class="scope-pill-btn" style="text-decoration:none; color: var(--ug-green); display:inline-flex; align-items:center;">
                        📊 CSV
                    </a>
                </div>
            </div>
        </div>

        <!-- History Table Card -->
        <div class="history-table-card">
            <div class="history-table-scroll">
                <table class="itms-grid-table">
                    <thead>
                        <tr>
                            <th style="width:160px;">Timestamp</th>
                            <th style="width:130px;">Vehicle Plate</th>
                            <th style="width:160px;">Matched Order #</th>
                            <th style="width:140px;">Action</th>
                            <th style="width:110px;">Status</th>
                            <th style="width:120px;">Operator</th>
                            <th>Audit Message</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-tbody">
                        <tr>
                            <td colspan="7" style="text-align:center; padding:40px; color:var(--ug-text-muted);">
                                Loading historical verification audit events...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
