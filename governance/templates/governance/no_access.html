{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Access - CLOSE Copilot</title>
    <link rel="shortcut icon" href="{% static 'core/logos/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'core/css/uganda_theme.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/app_layout.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/auth.css' %}">
</head>
<body>
    <div class="uganda-flag-ribbon"></div>
    <div class="auth-page-wrapper">
        <div class="auth-card-box">
            <div class="auth-card-head">
                <h1 style="font-size:1.25rem; font-weight:800; color:#ffffff;">
                    CLOSE <span style="color:var(--ug-yellow);">COPILOT</span>
                </h1>
            </div>
            <div class="auth-card-body">
                <div class="alert-banner warning"><span>{{ message }}</span></div>
                <p style="font-size:0.8rem; color:var(--ug-text-muted);">Reference: {{ code }}</p>
                <a class="btn btn-primary" href="/logout/" style="justify-content:center; padding:11px;">Sign out</a>
            </div>
        </div>
    </div>
</body>
</html>
