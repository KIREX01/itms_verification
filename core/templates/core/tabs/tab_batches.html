<!-- TAB 3: INGESTION & BATCHES (Full-Scale Stream & Expandable Headers) -->
<div class="tab-pane" id="pane-batches">
    <div class="batches-pane-container">
        <!-- Top Toolbar -->
        <div class="batches-header-bar">
            <div>
                <h3 style="font-size:1.05rem; font-weight:800; color:#fff; display:flex; align-items:center; gap:8px;">
                    <span>📦 Photo Ingestion Batches &amp; Evidence Stream</span>
                    <span class="badge badge-yellow" id="batches-count-badge">0 Batches</span>
                </h3>
                <p class="desktop-only-text" style="font-size:0.75rem; color:var(--ug-text-muted); margin-top:3px;">
                    Expand any batch header to inspect evidence photos at full scale, or collapse/minimize to scroll through other sessions.
                </p>
            </div>
            <div class="batches-toolbar-controls">
                <input type="text" id="batch-search-input" class="batch-search-field" placeholder="🔍 Filter batches..." oninput="filterBatchesStream()">
                
                <div class="mobile-util-row">
                    <button class="btn btn-secondary" onclick="expandAllBatches()" title="Expand all">▼ Expand</button>
                    <button class="btn btn-secondary" onclick="collapseAllBatches()" title="Collapse all">▲ Collapse</button>
                    <button class="btn btn-secondary" onclick="fetchBatchesList()" title="Refresh">🔄 Refresh</button>
                </div>

                <div class="mobile-primary-actions">
                    <button class="btn btn-secondary" onclick="openMobileConnectModal()" id="btn-open-mobile-modal" title="Connect phone camera" style="border-color:var(--ug-cyan); color:var(--ug-cyan);">
                        📱 Phone Camera
                    </button>
                    <button class="btn btn-primary" onclick="openBatchUploadModal()" id="btn-open-upload-modal">
                        📷 + Upload
                    </button>
                </div>
            </div>
        </div>

        <!-- Batches Date Scope Bar (TUI Mirror) -->
        <div class="scope-filter-bar">
            <div class="scope-filter-bar-left">
                <span class="scope-filter-label">📅 SCOPE:</span>
                <div class="scope-pills-group">
                    <button class="scope-pill-btn active" id="btn-bscope-today" onclick="setBatchesDateScope('TODAY')" title="Batches created during today's shift (Hotkey: D)">
                        🔥 Today's Batches
                    </button>
                    <button class="scope-pill-btn" id="btn-bscope-active" onclick="setBatchesDateScope('ACTIVE_BATCH')" title="Focus solely on the active latest batch">
                        ⚡ Active Batch
                    </button>
                    <button class="scope-pill-btn" id="btn-bscope-carryover" onclick="setBatchesDateScope('CARRYOVER')" title="Batches from previous shifts">
                        ⏳ Prior Carryover
                    </button>
                    <button class="scope-pill-btn" id="btn-bscope-all" onclick="setBatchesDateScope('ALL')" title="All batches across history">
                        🌐 All Batches
                    </button>
                </div>
            </div>
            <span class="scope-summary-tag" id="batches-scope-summary-tag">Showing today's shift</span>
        </div>

        <!-- Full-Width Batches Accordion Stream -->
        <div class="batches-stream-scroll" id="batches-stream-container">
            <div class="batches-loading-state" id="batches-loading-state">
                <span style="font-size:2rem;">⏳</span>
                <span style="margin-top:8px;">Loading ingestion batches and evidence photos...</span>
            </div>
        </div>
    </div>
</div>
