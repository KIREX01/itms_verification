{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Sign In - ITMS Closing System</title>

    <!-- Favicon & Touch Icons -->
    <link rel="shortcut icon" href="{% static 'core/logos/favicon.ico' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'core/logos/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'core/logos/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'core/logos/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'core/logos/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'core/logos/site.webmanifest' %}">

    <!-- Open Graph & Link Sharing Metadata -->
    <meta property="og:site_name" content="ITMS Verification Copilot">
    <meta property="og:title" content="Operator Sign In - ITMS Verification Console">
    <meta property="og:description" content="Official Ugandan vehicle fitment verification, evidence review, and ITMS registry sync platform.">
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'core/logos/android-chrome-512x512.png' %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Operator Sign In - ITMS Verification Console">
    <meta name="twitter:description" content="Official Ugandan vehicle fitment verification, evidence review, and ITMS registry sync platform.">
    <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'core/logos/android-chrome-512x512.png' %}">
    <link rel="stylesheet" href="{% static 'core/css/uganda_theme.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/app_layout.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/auth.css' %}">
</head>
<body>

    <!-- Uganda National Flag Ribbon -->
    <div class="uganda-flag-ribbon"></div>

    <div class="auth-page-wrapper">
        <div class="auth-card-box">
            <div class="auth-card-head">
                <div style="display:flex; justify-content:center; margin-bottom:14px;">
                    <img src="{% static 'core/logos/android-chrome-192x192.png' %}" alt="ITMS Logo" style="width:64px; height:64px; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.5); border:1px solid var(--ug-border); object-fit:contain; background:#0c0f17;">
                </div>
                <h1 style="font-size:1.35rem; font-weight:800; color:#ffffff; letter-spacing:0.5px;">
                    ITMS <span style="color:var(--ug-yellow);">CLOSING</span> SYSTEM
                </h1>
                <p style="font-size:0.75rem; color:var(--ug-text-muted); margin-top:2px;">
                    Uganda National Fitment Verification • Operator Authentication
                </p>
            </div>

            <div class="auth-card-body">
                {% if error %}
                    <div class="alert-banner error">
                        <span>⚠️ {{ error }}</span>
                    </div>
                {% endif %}

                {% if info %}
                    <div class="alert-banner warning">
                        <span>ℹ️ {{ info }}</span>
                    </div>
                {% endif %}

                <form method="POST" action="{% url 'core:login' %}" style="display:flex; flex-direction:column; gap:14px;">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next_url }}">

                    <div class="form-field">
                        <label for="username">Operator Username</label>
                        <input type="text" id="username" name="username" value="{{ last_username }}" required autofocus placeholder="e.g. admin or operator_john">
                    </div>

                    <div class="form-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter password">
                    </div>

                    <div style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="remember" name="remember" value="1" checked style="accent-color:var(--ug-yellow);">
                        <label for="remember" style="font-size:0.8rem; color:var(--ug-text-muted); cursor:pointer;">Remember on this terminal</label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px; margin-top:4px;">
                        Sign In to Console
                    </button>
                </form>
            </div>

            <div class="auth-card-footer">
                <div>
                    New operator on this terminal? <a href="{% url 'core:signup' %}">Create Account</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
