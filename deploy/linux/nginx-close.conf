# Add inside the close.kirex.online `server { ... }` block (TLS server).
# Static assets straight from disk; everything else (including /media/ evidence photos) via Django.
location /static/ {
    alias /opt/itms/staticfiles/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 200m;
    # Server-sent events (pipeline progress) must not be buffered.
    proxy_buffering off;
}
