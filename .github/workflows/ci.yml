name: ITMS Verification CI/CD

on:
  push:
    branches:
      - main
      - release/linux
      - release/windows
  pull_request:
    branches:
      - main
      - release/linux
      - release/windows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr libgl1 libglib2.0-0

      - name: Upgrade Pip and Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        run: |
          python manage.py check

      - name: Check Django Migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Core Test Suites
        env:
          DJANGO_DEBUG: "True"
          SECURE_SSL_REDIRECT: "False"
        run: |
          python manage.py test core.tests.test_device_detection core.tests.test_date_service core.tests.test_reports_and_lifecycle core.tests.test_improvements core.tests.test_installation_kits core.tests.test_signup_2fa core.tests.test_stock_monitoring core.tests.test_api_auth core.tests.test_api_envelope core.tests.test_platform_service core.tests.test_ssl_service core.tests.test_direct_order_install

      - name: Verify CLI Launcher and Command Help
        run: |
          python itms_cli.py --version
          python itms_cli.py --help

      - name: Verify Distribution Packaging (Smoke Test)
        run: |
          python scripts/package_release.py --target all
