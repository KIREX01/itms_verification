name: Release Dual-Platform Distribution Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.8)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(python -c "from core.version import __version__; print(__version__)")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building packages for version $VERSION"

      - name: Package Windows & Linux Distributions
        run: |
          python scripts/package_release.py --version "${{ steps.get_version.outputs.VERSION }}" --target all

      - name: Verify Generated Packages
        run: |
          ls -la dist/
          test -f "dist/itms-v${{ steps.get_version.outputs.VERSION }}-windows.zip"
          test -f "dist/itms-v${{ steps.get_version.outputs.VERSION }}-linux.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: ITMS Verification Copilot v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/itms-v${{ steps.get_version.outputs.VERSION }}-windows.zip
            dist/itms-v${{ steps.get_version.outputs.VERSION }}-linux.tar.gz
