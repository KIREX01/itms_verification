# Rate limiting zones
limit_req_zone $binary_remote_addr zone=itms_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=itms_auth:10m rate=5r/m;

# Default catch-all server blocks (drop direct IP scans and unrecognized Host headers)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/close.kirex.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/close.kirex.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

# HTTP to HTTPS redirect for close.kirex.online
server {
    listen 80;
    listen [::]:80;
    server_name close.kirex.online;
    server_tokens off;

    return 301 https://$host$request_uri;
}

# Main secure application server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name close.kirex.online;

    client_max_body_size 100M;
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/close.kirex.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/close.kirex.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Maintenance Page Fallback (when app is stopped or maintenance mode is active)
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /opt/itms/templates;
        internal;
    }

    # Static assets
    location /static/ {
        alias /opt/itms/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # WebSocket connections
    location /ws/ {
        if (-f /opt/itms/secure/maintenance.flag) {
            return 503;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Strict rate limiting for login authentication
    location /api/auth/login/ {
        if (-f /opt/itms/secure/maintenance.flag) {
            return 503;
        }
        limit_req zone=itms_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    # Primary application traffic
    location / {
        if (-f /opt/itms/secure/maintenance.flag) {
            return 503;
        }
        limit_req zone=itms_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }
}
