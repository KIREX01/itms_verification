{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>2-step sign-in - CLOSE Copilot</title>
    <link rel="stylesheet" href="{% static 'backoffice/backoffice.css' %}?v=2">
</head>
<body class="bo">
<main class="bo-main" style="max-width:420px; margin:0 auto;">
    {% for m in messages %}<div class="bo-msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    <div class="bo-card" style="text-align:center;">
        <img src="{% static 'core/logos/android-chrome-192x192.png' %}" alt="CLOSE Copilot" width="56" height="56" style="border-radius:12px; display:block; margin:0 auto 10px;">
        <h2 style="margin-top:0;">2-step sign-in</h2>
        <p>Enter the 6-digit code from your authenticator app.</p>
        <form method="post" style="display:flex; flex-direction:column; gap:10px; align-items:center;">{% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <input type="text" id="code" name="code" required autofocus autocomplete="off" maxlength="9" aria-label="Code"
                   placeholder="••••••" style="font-size:24px; letter-spacing:6px; text-align:center; width:220px;">
            <button class="bo-btn primary">Continue</button>
        </form>
        <p class="bo-muted" style="margin:14px 0 0;">Lost your phone? Use a recovery code. · <a href="/logout/">Sign out</a></p>
    </div>
</main>
</body>
</html>
