{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CLOSE Copilot</title>

    <!-- Favicon & Touch Icons -->
    <link rel="shortcut icon" href="{% static 'core/logos/favicon.ico' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'core/logos/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'core/logos/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'core/logos/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'core/logos/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'core/logos/site.webmanifest' %}">

    <!-- Open Graph & Link Sharing Metadata -->
    <meta property="og:site_name" content="CLOSE Copilot">
    <meta property="og:title" content="Sign In - CLOSE Copilot">
    <meta property="og:description" content="Depot plate audit, vehicle evidence inspection, and hardware inventory management.">
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'core/logos/android-chrome-512x512.png' %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Sign In - CLOSE Copilot">
    <meta name="twitter:description" content="Depot plate audit, vehicle evidence inspection, and hardware inventory management.">
    <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'core/logos/android-chrome-512x512.png' %}">
    <link rel="stylesheet" href="{% static 'core/css/uganda_theme.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/app_layout.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/auth.css' %}">
</head>
<body>

    <!-- Uganda National Flag Ribbon -->
    <div class="uganda-flag-ribbon"></div>

    <div class="auth-page-wrapper">
        <div class="auth-card-box">
            {% include "governance/_auth_brand.html" with subtitle="Sign in" %}

            <div class="auth-card-body">
                {% if error %}
                    <div class="alert-banner error"><span>{{ error }}</span></div>
                {% endif %}

                {% if info %}
                    <div class="alert-banner success"><span>{{ info }}</span></div>
                {% endif %}

                <form method="POST" action="{% url 'core:login' %}" style="display:flex; flex-direction:column; gap:14px;">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next_url }}">

                    <div class="form-field">
                        <label for="username">Username or email</label>
                        <input type="text" id="username" name="username" value="{{ last_username }}" required autofocus autocomplete="username" autocapitalize="none">
                    </div>

                    <div class="form-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>

                    <div style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="remember" name="remember" value="1" checked style="accent-color:var(--ug-yellow);">
                        <label for="remember" style="font-size:0.8rem; color:var(--ug-text-muted); cursor:pointer;">Keep me signed in</label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px; margin-top:4px;">
                        Sign in
                    </button>
                </form>
            </div>

            <div class="auth-card-footer">
                New here? <a href="{% url 'core:access_request' %}">Request access</a>
            </div>
        </div>
    </div>

</body>
</html>
