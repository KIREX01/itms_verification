{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Set up 2-step sign-in - CLOSE Copilot</title>
    <link rel="stylesheet" href="{% static 'backoffice/backoffice.css' %}?v=2">
</head>
<body class="bo">
<main class="bo-main" style="max-width:440px; margin:0 auto;">
    {% for m in messages %}<div class="bo-msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    <div class="bo-card" style="text-align:center;">
        <img src="{% static 'core/logos/android-chrome-192x192.png' %}" alt="CLOSE Copilot" width="56" height="56" style="border-radius:12px; display:block; margin:0 auto 10px;">
        <h2 style="margin-top:0;">Set up 2-step sign-in</h2>
        <p>Scan with your authenticator app, then enter the 6-digit code.</p>
        <div style="background:#fff; padding:12px; border-radius:8px; width:min(240px, 100%); margin:12px auto;">{{ qr_svg|safe }}</div>
        <details style="margin:0 0 14px;"><summary class="bo-muted" style="cursor:pointer;">Can't scan?</summary>
            <p class="bo-muted" style="margin:8px 0 0;">Enter this key in the app:<br>
                <code style="font-size:15px; letter-spacing:1px; user-select:all;">{{ secret }}</code></p></details>
        <form method="post" style="display:flex; flex-direction:column; gap:10px; align-items:center;">{% csrf_token %}
            <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus
                   autocomplete="off" aria-label="6-digit code" placeholder="••••••"
                   oninput="this.value = this.value.replace(/\D/g, '').slice(0, 6)"
                   style="font-size:24px; letter-spacing:8px; text-align:center; width:200px;">
            <button class="bo-btn primary">Turn on</button>
        </form>
    </div>
</main>
</body>
</html>
