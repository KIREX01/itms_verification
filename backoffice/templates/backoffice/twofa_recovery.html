{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Recovery Codes - CLOSE Copilot</title>
    <link rel="stylesheet" href="{% static 'backoffice/backoffice.css' %}?v=2">
</head>
<body class="bo">
<main class="bo-main" style="max-width:560px; margin:0 auto;">
    <div class="bo-card" style="text-align:center;">
        <img src="{% static 'core/logos/android-chrome-192x192.png' %}" alt="CLOSE Copilot" width="56" height="56" style="border-radius:12px; display:block; margin:0 auto 10px;">
        <h2 style="margin-top:0;">2-step sign-in is on</h2>
        <p>Save these recovery codes. Each works once if you lose your phone. They are shown only now.</p>
        <pre style="background:#0b1220; padding:14px; border-radius:8px; font-size:16px; line-height:1.8; text-align:center;">{% for c in recovery_codes %}{{ c }}{% if not forloop.last %}
{% endif %}{% endfor %}</pre>
        <a class="bo-btn primary" href="/backoffice/">Continue</a>
    </div>
</main>
</body>
</html>
